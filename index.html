<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>弓箭手大作戰：雙端對戰版</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0f172a; touch-action: none; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        
        /* 手機直向提示畫面 */
        #rotate-notice {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0f172a;
            color: #38bdf8;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        #rotate-notice i {
            font-size: 50px;
            margin-bottom: 20px;
            animation: rotateAnim 2s infinite ease-in-out;
        }
        @keyframes rotateAnim {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        /* 螢幕為直立時，顯示旋轉提示 */
        @media screen and (orientation: portrait) {
            #rotate-notice { display: flex !important; }
        }

        /* 登入視窗 */
        #login-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .login-box {
            background: #1e293b;
            border: 2px solid #38bdf8;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            color: #fff;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }
        .login-box h2 { margin-top: 0; margin-bottom: 20px; color: #38bdf8; }
        .login-box input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            margin-bottom: 20px;
            text-align: center;
            outline: none;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .login-box button:active { background: #0284c7; }

        #top-gui {
            position: absolute;
            top: 15px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 15px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 20px; border-radius: 50px;
            color: #fff; z-index: 10;
        }
        .stat-box { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 140px; height: 140px; z-index: 20; }
        
        #upgrade-modal {
            display: none; position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid #38bdf8;
            padding: 20px; border-radius: 24px;
            text-align: center; color: #fff; z-index: 100;
            width: 85%; max-width: 400px;
        }
        .skill-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .skill-card {
            background: #1e293b; border: 1px solid #334155;
            padding: 12px; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; gap: 15px;
        }
        .skill-card i { font-size: 24px; color: #38bdf8; }
    </style>
</head>
<body>

<!-- 手機直立時的提醒提示 -->
<div id="rotate-notice">
    <i class="fa-solid fa-mobile-screen-button"></i>
    <p>📱 請將手機轉為橫向<br>以獲得最佳體驗</p>
</div>

<div id="login-modal">
    <div class="login-box">
        <h2><i class="fa-solid fa-bow-arrow"></i> 弓箭手大作戰</h2>
        <input type="text" id="player-name-input" placeholder="請輸入名字..." maxlength="10">
        <button onclick="startGame()">進入遊戲</button>
    </div>
</div>

<div id="game-container">
    <div id="top-gui">
        <div class="stat-box"><i class="fa-solid fa-crown" style="color:#facc15;"></i> LV.<span id="gui-level">1</span></div>
        <div class="stat-box"><i class="fa-solid fa-bolt" style="color:#38bdf8;"></i> <span id="gui-exp">0</span></div>
        <div class="stat-box"><i class="fa-solid fa-heart" style="color:#ef4444;"></i> <span id="gui-hp">100/100</span></div>
    </div>

    <div id="joystick-zone"></div>

    <div id="upgrade-modal">
        <h3><i class="fa-solid fa-wand-magic-sparkles"></i> 等級提升！選擇能力</h3>
        <div class="skill-grid">
            <div class="skill-card" onclick="applySkill('triple')">
                <i class="fa-solid fa-burst"></i>
                <div><b>三連散射</b><br><small style="color:#94a3b8;">一次發射 3 發箭矢</small></div>
            </div>
            <div class="skill-card" onclick="applySkill('speed')">
                <i class="fa-solid fa-gauge-high"></i>
                <div><b>攻擊射速 UP</b><br><small style="color:#94a3b8;">大幅降低攻擊間隔</small></div>
            </div>
            <div class="skill-card" onclick="applySkill('hp')">
                <i class="fa-solid fa-shield-halved"></i>
                <div><b>生命上限 +50</b><br><small style="color:#94a3b8;">提高生存能力並補血</small></div>
            </div>
        </div>
    </div>
</div>

<script>
const socket = io();
let game, sceneRef;
let player, otherPlayers = {};
let arrowsGroup, otherArrowsGroup, gemsGroup;
let cursors, wasd;
let lastFired = 0;
let moveVector = { x: 0, y: 0 };
let playerStats = { name: '玩家', level: 1, exp: 0, hp: 100, maxHp: 100, arrowCount: 1, fireRate: 300 };

function startGame() {
    let nameInput = document.getElementById('player-name-input').value.trim();
    if (nameInput) playerStats.name = nameInput;
    document.getElementById('login-modal').style.display = 'none';

    initGame();
    socket.emit('joinGame', { name: playerStats.name });
}

function initGame() {
    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        parent: 'game-container',
        scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { default: 'arcade', arcade: { debug: false } },
        scene: { preload: preload, create: create, update: update }
    };
    game = new Phaser.Game(config);
}

function preload() {}

function create() {
    sceneRef = this;

    sceneRef.cameras.main.setBounds(0, 0, 1600, 1200);
    sceneRef.physics.world.setBounds(0, 0, 1600, 1200);

    // 背景網格
    let graphics = sceneRef.add.graphics();
    graphics.lineStyle(1, 0x334155, 0.8);
    for (let x = 0; x < 1600; x += 40) graphics.lineBetween(x, 0, x, 1200);
    for (let y = 0; y < 1200; y += 40) graphics.lineBetween(0, y, 1600, y);

    arrowsGroup = sceneRef.physics.add.group();
    otherArrowsGroup = sceneRef.physics.add.group();
    gemsGroup = sceneRef.physics.add.group();

    cursors = sceneRef.input.keyboard.createCursorKeys();
    wasd = sceneRef.input.keyboard.addKeys({
        up: Phaser.Input.Keyboard.KeyCodes.W,
        down: Phaser.Input.Keyboard.KeyCodes.S,
        left: Phaser.Input.Keyboard.KeyCodes.A,
        right: Phaser.Input.Keyboard.KeyCodes.D
    });

    initJoystick();

    // Socket 監聽事件
    socket.on('initSelf', (data) => {
        player = createPlayerContainer(sceneRef, data.x, data.y, data.name, 0x38bdf8, true);
        sceneRef.cameras.main.startFollow(player, true, 0.08, 0.08);
    });

    socket.on('currentPlayers', (players) => {
        Object.keys(players).forEach((id) => {
            if (id !== socket.id && !otherPlayers[id]) {
                otherPlayers[id] = createPlayerContainer(sceneRef, players[id].x, players[id].y, players[id].name, 0xef4444, false);
                otherPlayers[id].id = id;
            }
        });
    });

    socket.on('newPlayer', (info) => {
        if (!otherPlayers[info.id] && info.id !== socket.id) {
            otherPlayers[info.id] = createPlayerContainer(sceneRef, info.x, info.y, info.name, 0xef4444, false);
            otherPlayers[info.id].id = info.id;
        }
    });

    socket.on('playerMoved', (info) => {
        if (otherPlayers[info.id]) {
            otherPlayers[info.id].setPosition(info.x, info.y);
            otherPlayers[info.id].setRotation(info.rotation);
        }
    });

    socket.on('playerDisconnected', (id) => {
        if (otherPlayers[id]) {
            otherPlayers[id].destroy();
            delete otherPlayers[id];
        }
    });

    socket.on('gemsData', (gems) => { gems.forEach(g => spawnGem(sceneRef, g)); });
    socket.on('gemSpawn', (gem) => { spawnGem(sceneRef, gem); });

    socket.on('arrowFired', (data) => {
        fireArrowLocal(sceneRef, data.x, data.y, data.angle, false, data.ownerId);
    });

    socket.on('playerHealthUpdate', (data) => {
        if (data.id === socket.id) {
            playerStats.hp = data.hp;
            updateGUI();
        }
        let target = (data.id === socket.id) ? player : otherPlayers[data.id];
        if (target) updateHpBar(target, data.hp, data.maxHp);
    });

    socket.on('playerRespawn', (data) => {
        if (data.id === socket.id) {
            playerStats.hp = data.maxHp;
            player.setPosition(data.x, data.y);
            updateGUI();
            updateHpBar(player, data.hp, data.maxHp);
        } else if (otherPlayers[data.id]) {
            otherPlayers[data.id].setPosition(data.x, data.y);
            updateHpBar(otherPlayers[data.id], data.hp, data.maxHp);
        }
    });

    // 點擊發射箭矢
    sceneRef.input.on('pointerdown', (pointer) => {
        if (!player) return;
        // 避開搖桿區域
        if (pointer.x < 180 && pointer.y > window.innerHeight - 180) return;

        let now = sceneRef.time.now;
        if (now - lastFired > playerStats.fireRate) {
            lastFired = now;
            let angle = Phaser.Math.Angle.Between(player.x, player.y, pointer.worldX, pointer.worldY);
            player.setRotation(angle);

            if (playerStats.arrowCount === 1) {
                fireArrowLocal(sceneRef, player.x, player.y, angle, true, socket.id);
            } else {
                fireArrowLocal(sceneRef, player.x, player.y, angle - 0.2, true, socket.id);
                fireArrowLocal(sceneRef, player.x, player.y, angle, true, socket.id);
                fireArrowLocal(sceneRef, player.x, player.y, angle + 0.2, true, socket.id);
            }
        }
    });

    // 我方箭矢擊中敵人的碰撞判定
    sceneRef.physics.add.overlap(arrowsGroup, sceneRef.physics.world.bodies, (arrow, body) => {
        let targetContainer = body.gameObject;
        if (targetContainer && targetContainer.id && targetContainer.id !== socket.id) {
            socket.emit('hitPlayer', targetContainer.id);
            arrow.destroy();
        }
    });
}

function update() {
    if (!player || !player.body) return;

    let speed = 220;
    let vx = 0, vy = 0;

    if (cursors.left.isDown || wasd.left.isDown) vx = -speed;
    if (cursors.right.isDown || wasd.right.isDown) vx = speed;
    if (cursors.up.isDown || wasd.up.isDown) vy = -speed;
    if (cursors.down.isDown || wasd.down.isDown) vy = speed;

    if (moveVector.x !== 0 || moveVector.y !== 0) {
        vx = moveVector.x * speed;
        vy = moveVector.y * speed;
    }

    player.body.setVelocity(vx, vy);
    socket.emit('playerInput', { x: player.x, y: player.y, rotation: player.rotation });

    // 吃寶石判定
    sceneRef.physics.overlap(player, gemsGroup, (p, gem) => {
        socket.emit('collectGem', gem.id);
        gem.destroy();
        gainExp(25);
    });
}

function createPlayerContainer(scene, x, y, nameText, color, isSelf) {
    let container = scene.add.container(x, y);
    
    let body = scene.add.circle(0, 0, 18, color);
    let bow = scene.add.rectangle(12, 0, 10, 6, 0x0284c7);

    let name = scene.add.text(0, -38, nameText, { font: '12px Arial', fill: '#ffffff', stroke: '#000000', strokeThickness: 3 }).setOrigin(0.5);

    let hpBg = scene.add.rectangle(0, -25, 40, 6, 0x334155);
    let hpBar = scene.add.rectangle(-20, -25, 40, 6, 0xef4444).setOrigin(0, 0.5);

    container.add([body, bow, name, hpBg, hpBar]);
    container.hpBar = hpBar;

    scene.physics.world.enable(container);
    container.body.setCircle(18, -18, -18);
    container.body.setCollideWorldBounds(true);

    return container;
}

function updateHpBar(container, hp, maxHp) {
    if (container && container.hpBar) {
        let pct = Math.max(0, hp / maxHp);
        container.hpBar.width = 40 * pct;
    }
}

function initJoystick() {
    const options = {
        zone: document.getElementById('joystick-zone'),
        mode: 'static',
        position: { left: '70px', bottom: '70px' },
        color: 'white', size: 110
    };
    const manager = nipplejs.create(options);
    manager.on('move', (evt, data) => {
        if (data.vector) {
            moveVector.x = data.vector.x;
            moveVector.y = -data.vector.y;
            if (player) player.setRotation(data.angle.radian);
        }
    });
    manager.on('end', () => { moveVector.x = 0; moveVector.y = 0; });
}

function spawnGem(scene, gemData) {
    let gem = scene.add.circle(gemData.x, gemData.y, 6, 0xfacc15);
    gem.id = gemData.id;
    scene.physics.world.enable(gem);
    gemsGroup.add(gem);
}

// 修正後的箭矢發射 logic
function fireArrowLocal(scene, x, y, angle, isOwner, ownerId) {
    let arrow = scene.add.rectangle(x, y, 16, 4, 0xf59e0b);
    scene.physics.world.enable(arrow);
    arrow.setRotation(angle);

    // 賦予箭矢物理移動速度
    scene.physics.velocityFromRotation(angle, 700, arrow.body.velocity);

    if (isOwner) {
        arrowsGroup.add(arrow);
        socket.emit('shootArrow', { x: x, y: y, angle: angle, speed: 700 });
    } else {
        otherArrowsGroup.add(arrow);
    }

    // 1.5 秒後自動銷毀
    scene.time.delayedCall(1500, () => {
        if (arrow && arrow.active) {
            arrow.destroy();
        }
    });
}

function gainExp(amount) {
    playerStats.exp += amount;
    if (playerStats.exp >= playerStats.level * 100) {
        playerStats.level++;
        playerStats.exp = 0;
        document.getElementById('upgrade-modal').style.display = 'block';
    }
    updateGUI();
}

function updateGUI() {
    document.getElementById('gui-level').innerText = playerStats.level;
    document.getElementById('gui-exp').innerText = playerStats.exp;
    document.getElementById('gui-hp').innerText = `${playerStats.hp}/${playerStats.maxHp}`;
}

function applySkill(type) {
    if (type === 'triple') playerStats.arrowCount = 3;
    if (type === 'speed') playerStats.fireRate = 150;
    if (type === 'hp') { playerStats.maxHp += 50; playerStats.hp += 50; }

    document.getElementById('upgrade-modal').style.display = 'none';
    updateGUI();
}
</script>
</body>
</html>
