<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>弓箭手大作戰：雙端對戰版</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0f172a; touch-action: none; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        
        /* 手機直立時的提醒提示 */
        #rotate-notice {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98);
            color: #38bdf8;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        #rotate-notice i {
            font-size: 60px;
            margin-bottom: 20px;
            animation: rotateAnim 2s infinite ease-in-out;
            color: #fbbf24;
        }
        @keyframes rotateAnim {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media screen and (orientation: portrait) {
            #rotate-notice { display: flex !important; }
        }

        /* 登入視窗 */
        #login-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .login-box {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid rgba(56, 189, 248, 0.5);
            padding: 35px 30px;
            border-radius: 24px;
            text-align: center;
            color: #fff;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.2);
        }
        .login-box h2 {
            margin-top: 0; margin-bottom: 25px; color: #38bdf8;
            font-size: 26px; letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .login-box input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            font-size: 16px;
            margin-bottom: 25px;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }
        .login-box input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
            transition: 0.2s;
        }
        .login-box button:active { transform: scale(0.98); }

        /* 頂部 HUD 資訊欄 */
        #top-gui {
            position: absolute;
            top: 15px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 20px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 25px; border-radius: 50px;
            color: #fff; z-index: 10;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .stat-box { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: 0.5px; }
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 140px; height: 140px; z-index: 20; }
        
        /* 升級視窗 */
        #upgrade-modal {
            display: none; position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid #38bdf8;
            padding: 25px; border-radius: 24px;
            text-align: center; color: #fff; z-index: 100;
            width: 85%; max-width: 400px;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.3);
        }
        .skill-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
        .skill-card {
            background: rgba(30, 41, 59, 0.8); border: 1px solid #334155;
            padding: 14px; border-radius: 16px; cursor: pointer;
            display: flex; align-items: center; gap: 15px;
            transition: 0.2s;
        }
        .skill-card:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            transform: translateY(-2px);
        }
        .skill-card i { font-size: 26px; color: #38bdf8; }
    </style>
</head>
<body>

<div id="rotate-notice">
    <i class="fa-solid fa-mobile-screen-button"></i>
    <p>📱 請將手機轉為橫向<br>以獲得最佳體驗</p>
</div>

<div id="login-modal">
    <div class="login-box">
        <h2><i class="fa-solid fa-bow-arrow"></i> 弓箭手大作戰</h2>
        <input type="text" id="player-name-input" placeholder="請輸入名字..." maxlength="10">
        <button onclick="startGame()">進入遊戲</button>
    </div>
</div>

<div id="game-container">
    <div id="top-gui">
        <div class="stat-box"><i class="fa-solid fa-crown" style="color:#facc15;"></i> LV.<span id="gui-level">1</span></div>
        <div class="stat-box"><i class="fa-solid fa-bolt" style="color:#38bdf8;"></i> <span id="gui-exp">0</span></div>
        <div class="stat-box"><i class="fa-solid fa-heart" style="color:#ef4444;"></i> <span id="gui-hp">100/100</span></div>
    </div>

    <div id="joystick-zone"></div>

    <div id="upgrade-modal">
        <h3><i class="fa-solid fa-wand-magic-sparkles" style="color:#facc15;"></i> 等級提升！選擇能力</h3>
        <div class="skill-grid">
            <div class="skill-card" onclick="applySkill('triple')">
                <i class="fa-solid fa-burst"></i>
                <div style="text-align:left;"><b>三連散射</b><br><small style="color:#94a3b8;">一次發射 3 發箭矢</small></div>
            </div>
            <div class="skill-card" onclick="applySkill('speed')">
                <i class="fa-solid fa-gauge-high"></i>
                <div style="text-align:left;"><b>攻擊射速 UP</b><br><small style="color:#94a3b8;">大幅降低攻擊間隔</small></div>
            </div>
            <div class="skill-card" onclick="applySkill('hp')">
                <i class="fa-solid fa-shield-halved"></i>
                <div style="text-align:left;"><b>生命上限 +50</b><br><small style="color:#94a3b8;">提高生存能力並補血</small></div>
            </div>
        </div>
    </div>
</div>

<script>
const socket = io();
let game, sceneRef;
let player, otherPlayers = {};
let arrowsGroup, otherArrowsGroup, gemsGroup;
let cursors, wasd;
let lastFired = 0;
let moveVector = { x: 0, y: 0 };
let playerStats = { name: '玩家', level: 1, exp: 0, hp: 100, maxHp: 100, arrowCount: 1, fireRate: 300 };

function startGame() {
    let nameInput = document.getElementById('player-name-input').value.trim();
    if (nameInput) playerStats.name = nameInput;
    document.getElementById('login-modal').style.display = 'none';

    initGame();
    socket.emit('joinGame', { name: playerStats.name });
}

function initGame() {
    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        parent: 'game-container',
        scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { default: 'arcade', arcade: { debug: false } },
        scene: { preload: preload, create: create, update: update }
    };
    game = new Phaser.Game(config);
}

function preload() {}

function create() {
    sceneRef = this;

    sceneRef.cameras.main.setBounds(0, 0, 1600, 1200);
    sceneRef.physics.world.setBounds(0, 0, 1600, 1200);

    // 產生動態質感的精緻背景與地塊
    let bgGraphics = sceneRef.add.graphics();
    bgGraphics.fillStyle(0x1e293b, 1);
    bgGraphics.fillRect(0, 0, 1600, 1200);
    
    // 木格棋盤風格背景
    for (let x = 0; x < 1600; x += 80) {
        for (let y = 0; y < 1200; y += 80) {
            let isEven = ((x / 80) + (y / 80)) % 2 === 0;
            bgGraphics.fillStyle(isEven ? 0x1e293b : 0x0f172a, 0.6);
            bgGraphics.fillRect(x, y, 80, 80);
        }
    }

    // 地圖外圍網格與線條裝飾
    bgGraphics.lineStyle(4, 0x38bdf8, 0.4);
    bgGraphics.strokeRect(0, 0, 1600, 1200);

    arrowsGroup = sceneRef.physics.add.group();
    otherArrowsGroup = sceneRef.physics.add.group();
    gemsGroup = sceneRef.physics.add.group();

    cursors = sceneRef.input.keyboard.createCursorKeys();
    wasd = sceneRef.input.keyboard.addKeys({
        up: Phaser.Input.Keyboard.KeyCodes.W,
        down: Phaser.Input.Keyboard.KeyCodes.S,
        left: Phaser.Input.Keyboard.KeyCodes.A,
        right: Phaser.Input.Keyboard.KeyCodes.D
    });

    initJoystick();

    // Socket 監聽
    socket.on('initSelf', (data) => {
        player = createPlayerContainer(sceneRef, data.x, data.y, data.name, 0x38bdf8, true);
        player.id = socket.id;
        sceneRef.cameras.main.startFollow(player, true, 0.1, 0.1);
    });

    socket.on('currentPlayers', (players) => {
        Object.keys(players).forEach((id) => {
            if (id !== socket.id && !otherPlayers[id]) {
                otherPlayers[id] = createPlayerContainer(sceneRef, players[id].x, players[id].y, players[id].name, 0xef4444, false);
                otherPlayers[id].id = id;
            }
        });
    });

    socket.on('newPlayer', (info) => {
        if (!otherPlayers[info.id] && info.id !== socket.id) {
            otherPlayers[info.id] = createPlayerContainer(sceneRef, info.x, info.y, info.name, 0xef4444, false);
            otherPlayers[info.id].id = info.id;
        }
    });

    socket.on('playerMoved', (info) => {
        if (otherPlayers[info.id]) {
            otherPlayers[info.id].setPosition(info.x, info.y);
            if (otherPlayers[info.id].characterGraphics) {
                otherPlayers[info.id].characterGraphics.setRotation(info.rotation);
            }
        }
    });

    socket.on('playerDisconnected', (id) => {
        if (otherPlayers[id]) {
            otherPlayers[id].destroy();
            delete otherPlayers[id];
        }
    });

    socket.on('gemsData', (gems) => { gems.forEach(g => spawnGem(sceneRef, g)); });
    socket.on('gemSpawn', (gem) => { spawnGem(sceneRef, gem); });

    socket.on('arrowFired', (data) => {
        fireArrowLocal(sceneRef, data.x, data.y, data.angle, false, data.ownerId);
    });

    socket.on('playerHealthUpdate', (data) => {
        if (data.id === socket.id) {
            playerStats.hp = data.hp;
            updateGUI();
        }
        let target = (data.id === socket.id) ? player : otherPlayers[data.id];
        if (target) updateHpBar(target, data.hp, data.maxHp);
    });

    socket.on('playerRespawn', (data) => {
        if (data.id === socket.id) {
            playerStats.hp = data.maxHp;
            player.setPosition(data.x, data.y);
            updateGUI();
            updateHpBar(player, data.hp, data.maxHp);
        } else if (otherPlayers[data.id]) {
            otherPlayers[data.id].setPosition(data.x, data.y);
            updateHpBar(otherPlayers[data.id], data.hp, data.maxHp);
        }
    });

    // 點擊發射子彈
    sceneRef.input.on('pointerdown', (pointer) => {
        if (!player) return;
        if (pointer.x < 180 && pointer.y > window.innerHeight - 180) return;

        let now = sceneRef.time.now;
        if (now - lastFired > playerStats.fireRate) {
            lastFired = now;
            let angle = Phaser.Math.Angle.Between(player.x, player.y, pointer.worldX, pointer.worldY);
            
            if (player.characterGraphics) {
                player.characterGraphics.setRotation(angle);
            }

            if (playerStats.arrowCount === 1) {
                fireArrowLocal(sceneRef, player.x, player.y, angle, true, socket.id);
            } else {
                fireArrowLocal(sceneRef, player.x, player.y, angle - 0.2, true, socket.id);
                fireArrowLocal(sceneRef, player.x, player.y, angle, true, socket.id);
                fireArrowLocal(sceneRef, player.x, player.y, angle + 0.2, true, socket.id);
            }
        }
    });

    // 擊中判定：我方箭矢命中敵方玩家
    sceneRef.physics.add.overlap(arrowsGroup, sceneRef.physics.world.bodies, (arrow, body) => {
        let targetContainer = body.gameObject;
        if (targetContainer && targetContainer.id && targetContainer.id !== socket.id) {
            socket.emit('hitPlayer', targetContainer.id);
            arrow.destroy();
        }
    });
}

function update() {
    if (!player || !player.body) return;

    let speed = 240;
    let vx = 0, vy = 0;

    if (cursors.left.isDown || wasd.left.isDown) vx = -speed;
    if (cursors.right.isDown || wasd.right.isDown) vx = speed;
    if (cursors.up.isDown || wasd.up.isDown) vy = -speed;
    if (cursors.down.isDown || wasd.down.isDown) vy = speed;

    if (moveVector.x !== 0 || moveVector.y !== 0) {
        vx = moveVector.x * speed;
        vy = moveVector.y * speed;
    }

    player.body.setVelocity(vx, vy);

    let rotation = player.characterGraphics ? player.characterGraphics.rotation : 0;
    socket.emit('playerInput', { x: player.x, y: player.y, rotation: rotation });

    // 拾取寶石
    sceneRef.physics.overlap(player, gemsGroup, (p, gem) => {
        socket.emit('collectGem', gem.id);
        gem.destroy();
        gainExp(25);
    });
}

// 繪製精緻的 2D 角色 (包含陰影、圓形身體與弓箭)
function createPlayerContainer(scene, x, y, nameText, colorHex, isSelf) {
    let container = scene.add.container(x, y);

    // 1. 底弧陰影
    let shadow = scene.add.graphics();
    shadow.fillStyle(0x000000, 0.3);
    shadow.fillEllipse(0, 18, 36, 14);

    // 2. 角色身體與弓箭組合圖形
    let charGfx = scene.add.graphics();
    
    // 弓箭
    charGfx.lineStyle(3, 0xf59e0b, 1);
    charGfx.beginPath();
    charGfx.arc(12, 0, 16, -Math.PI/2.5, Math.PI/2.5, false);
    charGfx.strokePath();
    charGfx.lineStyle(1, 0xffffff, 0.8);
    charGfx.lineBetween(12, -14, 12, 14);

    // 身體圓形主體
    charGfx.fillStyle(colorHex, 1);
    charGfx.fillCircle(0, 0, 20);
    charGfx.lineStyle(3, 0xffffff, 0.9);
    charGfx.strokeCircle(0, 0, 20);

    // 眼睛
    charGfx.fillStyle(0xffffff, 1);
    charGfx.fillCircle(8, -6, 4);
    charGfx.fillCircle(8, 6, 4);
    charGfx.fillStyle(0x0f172a, 1);
    charGfx.fillCircle(10, -6, 2);
    charGfx.fillCircle(10, 6, 2);

    container.characterGraphics = charGfx;

    // 3. 名字標籤
    let name = scene.add.text(0, -42, nameText, {
        font: 'bold 13px Arial',
        fill: '#ffffff',
        stroke: '#0f172a',
        strokeThickness: 4
    }).setOrigin(0.5);

    // 4. 精緻血條
    let hpBg = scene.add.rectangle(0, -28, 44, 8, 0x0f172a).setStrokeStyle(1, 0x475569);
    let hpBar = scene.add.rectangle(-21, -28, 42, 6, 0x10b981).setOrigin(0, 0.5);

    container.add([shadow, charGfx, name, hpBg, hpBar]);
    container.hpBar = hpBar;

    scene.physics.world.enable(container);
    container.body.setCircle(20, -20, -20);
    container.body.setCollideWorldBounds(true);

    return container;
}

function updateHpBar(container, hp, maxHp) {
    if (container && container.hpBar) {
        let pct = Math.max(0, hp / maxHp);
        container.hpBar.width = 42 * pct;
        if (pct < 0.3) container.hpBar.setFillStyle(0xef4444);
        else if (pct < 0.6) container.hpBar.setFillStyle(0xf59e0b);
        else container.hpBar.setFillStyle(0x10b981);
    }
}

function initJoystick() {
    const options = {
        zone: document.getElementById('joystick-zone'),
        mode: 'static',
        position: { left: '70px', bottom: '70px' },
        color: 'white', size: 110
    };
    const manager = nipplejs.create(options);
    manager.on('move', (evt, data) => {
        if (data.vector) {
            moveVector.x = data.vector.x;
            moveVector.y = -data.vector.y;
            if (player && player.characterGraphics) {
                player.characterGraphics.setRotation(data.angle.radian);
            }
        }
    });
    manager.on('end', () => { moveVector.x = 0; moveVector.y = 0; });
}

// 產生帶發光質感的寶石
function spawnGem(scene, gemData) {
    let gemContainer = scene.add.container(gemData.x, gemData.y);
    
    let gemGfx = scene.add.graphics();
    gemGfx.fillStyle(0xfacc15, 1);
    gemGfx.fillGradientStyle(0xfde047, 0xfde047, 0xca8a04, 0xca8a04, 1);
    
    // 繪製菱形寶石
    gemGfx.beginPath();
    gemGfx.moveTo(0, -8);
    gemGfx.lineTo(7, 0);
    gemGfx.lineTo(0, 8);
    gemGfx.lineTo(-7, 0);
    gemGfx.closePath();
    gemGfx.fillPath();
    gemGfx.lineStyle(1, 0xffffff, 0.8);
    gemGfx.strokePath();

    gemContainer.add(gemGfx);
    gemContainer.id = gemData.id;

    scene.physics.world.enable(gemContainer);
    gemContainer.body.setCircle(8, -8, -8);
    gemsGroup.add(gemContainer);
}

// 精緻箭矢發射（修正子彈發射方向與物理速度）
function fireArrowLocal(scene, x, y, angle, isOwner, ownerId) {
    let arrowContainer = scene.add.container(x, y);

    let arrowGfx = scene.add.graphics();
    // 箭桿
    arrowGfx.lineStyle(2, 0xd97706, 1);
    arrowGfx.lineBetween(-10, 0, 8, 0);
    // 箭頭
    arrowGfx.fillStyle(0xf1f5f9, 1);
    arrowGfx.beginPath();
    arrowGfx.moveTo(12, 0);
    arrowGfx.lineTo(6, -4);
    arrowGfx.lineTo(6, 4);
    arrowGfx.closePath();
    arrowGfx.fillPath();
    // 箭羽
    arrowGfx.fillStyle(0xef4444, 1);
    arrowGfx.fillRect(-12, -3, 4, 6);

    arrowContainer.add(arrowGfx);
    arrowContainer.setRotation(angle);

    scene.physics.world.enable(arrowContainer);
    arrowContainer.body.setCircle(6, -6, -6);

    // 賦予正確的物理向量速度
    scene.physics.velocityFromRotation(angle, 800, arrowContainer.body.velocity);

    if (isOwner) {
        arrowsGroup.add(arrowContainer);
        socket.emit('shootArrow', { x: x, y: y, angle: angle, speed: 800 });
    } else {
        otherArrowsGroup.add(arrowContainer);
    }

    // 飛出 1.4 秒後銷毀
    scene.time.delayedCall(1400, () => {
        if (arrowContainer && arrowContainer.active) {
            arrowContainer.destroy();
        }
    });
}

function gainExp(amount) {
    playerStats.exp += amount;
    if (playerStats.exp >= playerStats.level * 100) {
        playerStats.level++;
        playerStats.exp = 0;
        document.getElementById('upgrade-modal').style.display = 'block';
    }
    updateGUI();
}

function updateGUI() {
    document.getElementById('gui-level').innerText = playerStats.level;
    document.getElementById('gui-exp').innerText = playerStats.exp;
    document.getElementById('gui-hp').innerText = `${playerStats.hp}/${playerStats.maxHp}`;
}

function applySkill(type) {
    if (type === 'triple') playerStats.arrowCount = 3;
    if (type === 'speed') playerStats.fireRate = 150;
    if (type === 'hp') { playerStats.maxHp += 50; playerStats.hp += 50; }

    document.getElementById('upgrade-modal').style.display = 'none';
    updateGUI();
}
</script>
</body>
</html>
