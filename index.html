<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>箭之勇者:Zhenhe</title>
    <!-- Phaser 遊戲引擎 & Socket.io -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <!-- FontAwesome 圖標套件 & NippleJS 虛擬搖桿套件 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <!-- 外部動態特效套件 (Animate.css, Canvas-Confetti, Simplex-Noise) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #022c22; touch-action: none; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        
        #rotate-notice {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 44, 34, 0.98); color: #38bdf8; z-index: 9999;
            flex-direction: column; justify-content: center; align-items: center; text-align: center; font-size: 20px; font-weight: bold;
        }
        #rotate-notice i { font-size: 60px; margin-bottom: 20px; animation: rotateAnim 2s infinite ease-in-out; color: #fbbf24; }
        @keyframes rotateAnim { 0% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } 100% { transform: rotate(0deg); } }

        #login-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 44, 34, 0.85); backdrop-filter: blur(16px);
            display: flex; justify-content: center; align-items: center; z-index: 200;
        }
        .login-box {
            background: linear-gradient(145deg, #065f46, #022c22); border: 2px solid rgba(74, 222, 128, 0.5);
            padding: 35px 30px; border-radius: 24px; text-align: center; color: #fff; width: 90%; max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .login-box h2 { margin-top: 0; margin-bottom: 8px; color: #4ade80; font-size: 26px; }
        .login-box .author-tag { color: #86efac; font-size: 14px; margin-bottom: 20px; }
        .login-box input {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #166534;
            background: rgba(5, 46, 22, 0.8); color: #fff; font-size: 16px; margin-bottom: 25px; text-align: center; outline: none;
        }
        .login-box button {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }

        #top-gui {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 15px; background: rgba(2, 44, 34, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(74, 222, 128, 0.3); padding: 8px 20px; border-radius: 50px; color: #fff; z-index: 10;
        }
        .stat-box { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
        
        .exp-bar-container {
            width: 140px; height: 14px; background: rgba(20, 83, 45, 0.9);
            border-radius: 10px; border: 1px solid rgba(74, 222, 128, 0.5); overflow: hidden; position: relative;
        }
        .exp-bar-fill {
            height: 100%; width: 0%; background: linear-gradient(90deg, #4ade80, #facc15);
            transition: width 0.3s ease;
        }
        .exp-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 10px; font-weight: bold; text-shadow: 0 0 3px #000; color: #fff; pointer-events: none;
        }

        #joystick-zone { position: absolute; bottom: 120px; left: 40px; width: 140px; height: 140px; z-index: 20; }
        
        #leaderboard {
            position: absolute; top: 15px; right: 15px; background: rgba(2, 44, 34, 0.85);
            border: 1px solid rgba(74, 222, 128, 0.4); border-radius: 12px; padding: 10px 15px;
            color: #fff; width: 160px; z-index: 10; font-size: 13px; backdrop-filter: blur(8px);
        }
        #leaderboard h4 { margin: 0 0 8px 0; color: #facc15; font-size: 14px; text-align: center; }
        #leaderboard-list { list-style: none; padding: 0; margin: 0; }
        #leaderboard-list li { display: flex; justify-content: space-between; margin-bottom: 4px; }

        #kill-feed {
            position: absolute; top: 75px; left: 15px; color: #ef4444; font-weight: bold;
            font-size: 14px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); z-index: 10; pointer-events: none;
        }

        #upgrade-modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; margin: auto;
            background: rgba(2, 44, 34, 0.95); backdrop-filter: blur(20px); border: 2px solid #4ade80;
            padding: 20px; border-radius: 20px; text-align: center; color: #fff; z-index: 100;
            width: 90%; max-width: 520px; height: fit-content; max-height: 85vh;
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.3);
        }
        #upgrade-modal h3 { margin: 0 0 15px 0; font-size: 18px; color: #facc15; }
        
        .skill-grid { 
            display: flex; flex-direction: row; justify-content: center; gap: 12px; 
            max-height: none; overflow: visible; 
        }
        .skill-card {
            flex: 1; background: rgba(20, 83, 45, 0.8); border: 1px solid #166534; 
            padding: 12px 8px; border-radius: 14px; cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            gap: 8px; transition: all 0.2s; min-width: 0;
        }
        .skill-card:hover { border-color: #4ade80; transform: scale(1.05); background: rgba(22, 101, 52, 0.9); }
        .skill-card b { font-size: 13px; line-height: 1.2; word-break: break-all; }
        .skill-card i { font-size: 26px; }
        .skill-card span { font-size: 10px; color: #9ca3af; text-align: center; }
    </style>
</head>
<body>

<div id="rotate-notice">
    <i class="fa-solid fa-mobile-screen-button"></i>
    <p>📱 請將手機轉為橫向<br>以獲得最佳體驗</p>
</div>

<div id="login-modal">
    <div class="login-box animate__animated animate__zoomIn">
        <h2><i class="fa-solid fa-bow-arrow"></i> 箭之勇者:Zhenhe</h2>
        <div class="author-tag">由 孫振賀 製作</div>
        <input type="text" id="player-name-input" placeholder="請輸入名字..." maxlength="10">
        <button onclick="startGame()">進入遊戲</button>
    </div>
</div>

<div id="game-container">
    <div id="top-gui">
        <div class="stat-box"><i class="fa-solid fa-crown" style="color:#facc15;"></i> LV.<span id="gui-level">1</span></div>
        <div class="stat-box">
            <i class="fa-solid fa-bolt" style="color:#4ade80;"></i>
            <div class="exp-bar-container">
                <div class="exp-bar-fill" id="exp-bar-fill"></div>
                <div class="exp-text" id="exp-text">0 / 100</div>
            </div>
        </div>
    </div>

    <div id="kill-feed"></div>

    <div id="leaderboard">
        <h4><i class="fa-solid fa-trophy"></i> 等級排行榜</h4>
        <ul id="leaderboard-list"></ul>
    </div>

    <div id="joystick-zone"></div>

    <div id="upgrade-modal" class="animate__animated animate__fadeInDown">
        <h3><i class="fa-solid fa-wand-magic-sparkles" style="color:#facc15;"></i> 等級提升！選擇能力</h3>
        <div class="skill-grid" id="skill-options-container"></div>
    </div>
</div>

<script>
const socket = io();
let game, sceneRef, minimap;
let player, otherPlayers = {}, otherPlayersGroup;
let arrowsGroup, otherArrowsGroup, gemsGroup, obstaclesGroup, bushesGroup;
let cursors, wasd;
let lastFired = 0;
let moveVector = { x: 0, y: 0 };
let currentAngle = 0;

const MAP_WIDTH = 2800;
const MAP_HEIGHT = 2000;

function seededRandom(seed) {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
}

let seedCounter = 12345;
let simplex = new SimplexNoise(() => seededRandom(seedCounter++));

let playerStats = { 
    name: '玩家', level: 1, exp: 0, hp: 500, maxHp: 500, shield: 0, maxShield: 100,
    speed: 240, arrowCount: 1, fireRate: 300, 
    piercing: false, lifesteal: 0,
    hasShield: false,
    hasBerserk: false,
    hasPoison: false,
    hasFrost: false,
    hasExplosive: false,
    arrowScale: 1.0,
    swiftCooldon: 1.0
};

const ALL_SKILLS = [
    { id: 'triple', name: '箭矢 +1', desc: '多發射一支箭矢', icon: 'fa-burst', color: '#38bdf8' },
    { id: 'speed', name: '攻速 UP', desc: '提升射擊速度', icon: 'fa-gauge-high', color: '#38bdf8' },
    { id: 'moveSpeed', name: '輕盈疾跑', desc: '提升移動速度', icon: 'fa-person-running', color: '#a855f7' },
    { id: 'pierce', name: '貫穿之箭', desc: '箭矢穿透障礙物', icon: 'fa-arrows-to-eye', color: '#f97316' },
    { id: 'lifesteal', name: '吸血光環', desc: '命中時恢復生命', icon: 'fa-vial', color: '#ef4444' },
    { id: 'hp', name: '生命上限', desc: '增加半格最大血量 (50 HP)', icon: 'fa-heart-pulse', color: '#10b981' },
    { id: 'shield', name: '聖光護盾', desc: '獲得防護罩與護盾', icon: 'fa-shield-halved', color: '#facc15' },
    { id: 'poison', name: '毒箭特化', desc: '附帶毒霧與持續傷害', icon: 'fa-flask-vial', color: '#84cc16' },
    { id: 'frost', name: '寒霜箭矢', desc: '附帶冰霜減速效果', icon: 'fa-snowflake', color: '#06b6d4' },
    { id: 'explosive', name: '爆裂箭頭', desc: '命中造成範圍爆炸', icon: 'fa-bomb', color: '#f43f5e' },
    { id: 'giant', name: '巨化重箭', desc: '箭矢體積與傷害大增', icon: 'fa-expand', color: '#eab308' }
];

function checkOrientation() {
    const notice = document.getElementById('rotate-notice');
    let isPortrait = window.matchMedia ? window.matchMedia("(orientation: portrait)").matches : (window.innerHeight > window.innerWidth);
    if (isPortrait && window.innerWidth < 1024) notice.style.display = 'flex';
    else notice.style.display = 'none';
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', checkOrientation);
setTimeout(checkOrientation, 300);

function startGame() {
    let nameInput = document.getElementById('player-name-input').value.trim();
    if (nameInput) playerStats.name = nameInput;
    document.getElementById('login-modal').style.display = 'none';
    initGame();
    socket.emit('joinGame', { name: playerStats.name });
}

function initGame() {
    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        parent: 'game-container',
        scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { default: 'arcade', arcade: { debug: false } },
        scene: { create: create, update: update }
    };
    game = new Phaser.Game(config);
}

function create() {
    sceneRef = this;

    let arrowGfx = sceneRef.make.graphics({x: 0, y: 0, add: false});
    arrowGfx.lineStyle(2, 0xd97706, 1);
    arrowGfx.lineBetween(0, 5, 18, 5);
    arrowGfx.fillStyle(0xf1f5f9, 1);
    arrowGfx.fillTriangle(18, 1, 26, 5, 18, 9);
    arrowGfx.fillStyle(0xef4444, 1);
    arrowGfx.fillRect(0, 2, 4, 6);
    arrowGfx.generateTexture('arrowTex', 28, 10);

    sceneRef.cameras.main.setBounds(0, 0, MAP_WIDTH, MAP_HEIGHT);
    sceneRef.physics.world.setBounds(0, 0, MAP_WIDTH, MAP_HEIGHT);

    let bgGraphics = sceneRef.add.graphics();
    bgGraphics.fillStyle(0x064e3b, 1);
    bgGraphics.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
    
    for (let x = 0; x < MAP_WIDTH; x += 100) {
        for (let y = 0; y < MAP_HEIGHT; y += 100) {
            let isEven = ((x / 100) + (y / 100)) % 2 === 0;
            bgGraphics.fillStyle(isEven ? 0x065f46 : 0x044e39, 0.8);
            bgGraphics.fillRect(x, y, 100, 100);
        }
    }

    let decoSeed = 999;
    for (let i = 0; i < 300; i++) {
        let dx = seededRandom(decoSeed++) * MAP_WIDTH;
        let dy = seededRandom(decoSeed++) * MAP_HEIGHT;
        bgGraphics.fillStyle(0x10b981, 0.3);
        bgGraphics.fillCircle(dx, dy, Math.floor(seededRandom(decoSeed++) * 3) + 1);
    }

    arrowsGroup = sceneRef.physics.add.group({ runChildUpdate: true });
    otherArrowsGroup = sceneRef.physics.add.group({ runChildUpdate: true });
    gemsGroup = sceneRef.physics.add.group();
    otherPlayersGroup = sceneRef.physics.add.group();
    obstaclesGroup = sceneRef.physics.add.staticGroup();
    bushesGroup = sceneRef.physics.add.staticGroup();

    generateForestTerrain();

    cursors = sceneRef.input.keyboard.createCursorKeys();
    wasd = sceneRef.input.keyboard.addKeys({
        up: Phaser.Input.Keyboard.KeyCodes.W, down: Phaser.Input.Keyboard.KeyCodes.S,
        left: Phaser.Input.Keyboard.KeyCodes.A, right: Phaser.Input.Keyboard.KeyCodes.D
    });

    initJoystick();

    socket.on('initSelf', (data) => {
        player = createPlayerContainer(sceneRef, data.x, data.y, data.name, 0x38bdf8);
        player.id = socket.id;
        sceneRef.cameras.main.startFollow(player, true, 0.08, 0.08);

        sceneRef.physics.add.collider(player, obstaclesGroup);

        minimap = sceneRef.cameras.add(window.innerWidth - 170, window.innerHeight - 130, 150, 110)
            .setZoom(0.05)
            .setName('mini');
        minimap.setBackgroundColor(0x022c22);
        minimap.scrollX = MAP_WIDTH / 2;
        minimap.scrollY = MAP_HEIGHT / 2;
    });

    socket.on('obstaclesData', (obsList) => {
        sceneRef.physics.add.overlap(arrowsGroup, obstaclesGroup, (arrow) => {
            if (!arrow.piercing) arrow.destroy();
        });
        sceneRef.physics.add.overlap(otherArrowsGroup, obstaclesGroup, (arrow) => {
            if (!arrow.piercing) arrow.destroy();
        });
    });

    socket.on('currentPlayers', (players) => {
        Object.keys(players).forEach((id) => {
            if (id !== socket.id && !otherPlayers[id]) {
                addOtherPlayer(id, players[id]);
            }
        });
    });

    socket.on('newPlayer', (info) => {
        if (!otherPlayers[info.id] && info.id !== socket.id) {
            addOtherPlayer(info.id, info);
        }
    });

    socket.on('playerMoved', (info) => {
        if (otherPlayers[info.id]) {
            otherPlayers[info.id].setPosition(info.x, info.y);
            if (otherPlayers[info.id].characterGraphics) {
                otherPlayers[info.id].characterGraphics.setRotation(info.rotation);
            }
            if (info.inBush !== undefined) {
                otherPlayers[info.id].inBush = info.inBush;
            }
        }
    });

    socket.on('playerDisconnected', (id) => {
        if (otherPlayers[id]) {
            otherPlayers[id].destroy();
            delete otherPlayers[id];
        }
    });

    socket.on('gemsData', (gems) => { gems.forEach(g => spawnGem(sceneRef, g)); });
    socket.on('gemSpawn', (gem) => { spawnGem(sceneRef, gem); });
    socket.on('gemCollected', (gemId) => {
        gemsGroup.getChildren().forEach(g => { if (g.id === gemId) g.destroy(); });
    });

    socket.on('arrowFired', (data) => {
        fireArrowLocal(sceneRef, data.x, data.y, data.angle, false, data.piercing, data.inBush, data.scale, data.effects);
    });

    socket.on('playerHealthUpdate', (data) => {
        if (data.id === socket.id) {
            let dmg = playerStats.hp - data.hp;
            if (dmg > 0 && playerStats.shield > 0) {
                if (playerStats.shield >= dmg) {
                    playerStats.shield -= dmg;
                    data.hp = playerStats.hp; 
                } else {
                    data.hp += playerStats.shield;
                    playerStats.shield = 0;
                }
            }
            playerStats.hp = data.hp;
            updateGUI();
        }
        let target = (data.id === socket.id) ? player : otherPlayers[data.id];
        if (target) updateHpBar(target, data.hp, (data.id === socket.id ? playerStats.maxHp : data.maxHp), (data.id === socket.id ? playerStats.shield : 0));
    });

    socket.on('killReward', (data) => {
        gainExp(data.exp);
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        
        let feed = document.getElementById('kill-feed');
        feed.innerText = `💥 你擊殺了 ${data.victimName}！經驗值 +${data.exp}`;
        setTimeout(() => { feed.innerText = ''; }, 3000);
    });

    socket.on('playerRespawn', (data) => {
        if (data.id === socket.id) {
            playerStats.level = 1;
            playerStats.exp = 0;
            playerStats.hp = 500;
            playerStats.maxHp = 500;
            playerStats.shield = 0;
            playerStats.speed = 240;
            playerStats.arrowCount = 1;
            playerStats.fireRate = 300;
            playerStats.piercing = false;
            playerStats.lifesteal = 0;
            playerStats.arrowScale = 1.0;
            playerStats.hasShield = false;
            playerStats.hasPoison = false;
            playerStats.hasFrost = false;
            playerStats.hasExplosive = false;

            player.setPosition(data.x, data.y);
            socket.emit('updateLevel', 1);
            updateGUI();
            updateHpBar(player, 500, 500, 0);
        } else if (otherPlayers[data.id]) {
            otherPlayers[data.id].setPosition(data.x, data.y);
            updateHpBar(otherPlayers[data.id], data.hp, data.maxHp, 0);
        }
    });

    socket.on('updateLeaderboard', (playersMap) => {
        let listEl = document.getElementById('leaderboard-list');
        listEl.innerHTML = '';
        let sorted = Object.values(playersMap).sort((a, b) => b.level - a.level);
        sorted.slice(0, 5).forEach(p => {
            let li = document.createElement('li');
            li.innerHTML = `<span>${p.name}</span><b>LV.${p.level}</b>`;
            listEl.appendChild(li);
        });
    });

    sceneRef.physics.add.overlap(arrowsGroup, otherPlayersGroup, (arrow, targetContainer) => {
        if (targetContainer && targetContainer.id && targetContainer.id !== socket.id) {
            let baseDmg = 15;
            if (playerStats.hasPoison) baseDmg += 6; 

            if (arrow.effects && arrow.effects.explosive) {
                createExplosionFX(sceneRef, arrow.x, arrow.y);
                baseDmg += 10;
            }

            if (arrow.effects && arrow.effects.frost) {
                createFrostFX(sceneRef, targetContainer.x, targetContainer.y);
            }

            if (arrow.effects && arrow.effects.poison) {
                createPoisonFX(sceneRef, targetContainer.x, targetContainer.y);
            }

            socket.emit('hitPlayer', {
                targetId: targetContainer.id,
                damage: baseDmg,
                lifesteal: playerStats.lifesteal
            });

            if (!arrow.piercing) {
                arrow.destroy();
            }
        }
    });
}

function createExplosionFX(scene, x, y) {
    let circle = scene.add.circle(x, y, 10, 0xf43f5e, 0.8);
    scene.tweens.add({
        targets: circle,
        radius: 45,
        alpha: 0,
        duration: 300,
        onComplete: () => circle.destroy()
    });
}

function createFrostFX(scene, x, y) {
    for (let i = 0; i < 6; i++) {
        let p = scene.add.circle(x + (Math.random()*30 - 15), y + (Math.random()*30 - 15), 4, 0x38bdf8, 0.9);
        scene.tweens.add({
            targets: p,
            scale: 0,
            duration: 400,
            onComplete: () => p.destroy()
        });
    }
}

function createPoisonFX(scene, x, y) {
    let cloud = scene.add.circle(x, y, 15, 0x84cc16, 0.6);
    scene.tweens.add({
        targets: cloud,
        scale: 2,
        alpha: 0,
        duration: 500,
        onComplete: () => cloud.destroy()
    });
}

// 建立ㄇ字型石頭掩體
function createRockFortress(scene, x, y) {
    let fortGroup = [];
    
    // 定義ㄇ字型的三面牆體結構 (相對座標, 寬, 高)
    let wallConfigs = [
        { x: 0, y: -60, w: 140, h: 28 },  // 上牆
        { x: -56, y: 0, w: 28, h: 100 },  // 左牆
        { x: 56, y: 0, w: 28, h: 100 }    // 右牆
    ];

    wallConfigs.forEach(cfg => {
        let wallGfx = scene.add.graphics();
        wallGfx.fillStyle(0x334155, 1);
        wallGfx.fillRect(-cfg.w/2, -cfg.h/2, cfg.w, cfg.h);
        wallGfx.lineStyle(3, 0x64748b, 1);
        wallGfx.strokeRect(-cfg.w/2, -cfg.h/2, cfg.w, cfg.h);

        let container = scene.add.container(x + cfg.x, y + cfg.y, [wallGfx]);
        scene.physics.world.enable(container, Phaser.Physics.Arcade.STATIC_BODY);
        container.body.setSize(cfg.w, cfg.h);
        container.body.setOffset(-cfg.w/2, -cfg.h/2);
        container.setDepth(5);
        
        obstaclesGroup.add(container);
        fortGroup.push(container);
    });

    return fortGroup;
}

function generateForestTerrain() {
    let treeSeed = 8888;
    for (let i = 0; i < 80; i++) {
        let tx = Math.floor(seededRandom(treeSeed++) * (MAP_WIDTH - 100)) + 50;
        let ty = Math.floor(seededRandom(treeSeed++) * (MAP_HEIGHT - 100)) + 50;
        let treeGfx = sceneRef.add.graphics();
        
        treeGfx.fillStyle(0x78350f, 1);
        treeGfx.fillRect(tx - 8, ty - 5, 16, 26);
        treeGfx.fillStyle(0x14532d, 0.85);
        treeGfx.fillCircle(tx, ty - 25, 34);
        treeGfx.fillStyle(0x166534, 0.9);
        treeGfx.fillCircle(tx - 10, ty - 30, 24);
        treeGfx.fillCircle(tx + 10, ty - 22, 22);
        treeGfx.setDepth(1);
    }

    // 地圖四個方位生成可躲藏的「ㄇ字型大型巨石」
    createRockFortress(sceneRef, 600, 500);
    createRockFortress(sceneRef, 2200, 500);
    createRockFortress(sceneRef, 600, 1500);
    createRockFortress(sceneRef, 2200, 1500);

    for (let x = 150; x < MAP_WIDTH - 100; x += 140) {
        for (let y = 150; y < MAP_HEIGHT - 100; y += 140) {
            let noiseVal = simplex.noise2D(x * 0.002, y * 0.002);
            
            if (noiseVal > 0.38) {
                let pillarGfx = sceneRef.add.graphics();
                let type = Math.floor(Math.abs(noiseVal * 10)) % 3;
                let container = sceneRef.add.container(x, y);

                if (type === 0) {
                    pillarGfx.fillStyle(0x334155, 1);
                    pillarGfx.fillCircle(0, 0, 36);
                    pillarGfx.lineStyle(3, 0x64748b, 1);
                    pillarGfx.strokeCircle(0, 0, 36);
                    
                    container.add(pillarGfx);
                    sceneRef.physics.world.enable(container, Phaser.Physics.Arcade.STATIC_BODY);
                    container.body.setCircle(34, -34, -34);
                } else if (type === 1) {
                    pillarGfx.fillStyle(0x475569, 1);
                    pillarGfx.fillCircle(0, 0, 22);
                    pillarGfx.lineStyle(2, 0x94a3b8, 1);
                    pillarGfx.strokeCircle(0, 0, 22);

                    container.add(pillarGfx);
                    sceneRef.physics.world.enable(container, Phaser.Physics.Arcade.STATIC_BODY);
                    container.body.setCircle(20, -20, -20);
                } else {
                    pillarGfx.fillStyle(0x1e293b, 1);
                    pillarGfx.fillRect(-28, -28, 56, 56);
                    pillarGfx.lineStyle(3, 0x475569, 1);
                    pillarGfx.strokeRect(-28, -28, 56, 56);

                    container.add(pillarGfx);
                    sceneRef.physics.world.enable(container, Phaser.Physics.Arcade.STATIC_BODY);
                    container.body.setSize(54, 54);
                    container.body.setOffset(-27, -27);
                }

                container.setDepth(5);
                obstaclesGroup.add(container);
            } 
            else if (noiseVal < -0.35) {
                let bushGfx = sceneRef.add.graphics();
                bushGfx.fillStyle(0x15803d, 0.75);
                bushGfx.fillCircle(0, 0, 42);
                bushGfx.fillStyle(0x22c55e, 0.65);
                bushGfx.fillCircle(-12, -10, 26);
                bushGfx.fillCircle(14, 12, 28);

                let bushContainer = sceneRef.add.container(x, y, [bushGfx]);
                sceneRef.physics.world.enable(bushContainer, Phaser.Physics.Arcade.STATIC_BODY);
                bushContainer.body.setCircle(40, -40, -40);
                bushContainer.setDepth(4);
                bushesGroup.add(bushContainer);
            }
        }
    }
}

function addOtherPlayer(id, data) {
    let p = createPlayerContainer(sceneRef, data.x, data.y, data.name, 0xef4444);
    p.id = id;
    p.inBush = false;
    otherPlayers[id] = p;
    otherPlayersGroup.add(p);
}

function update() {
    if (!player || !player.body) return;

    let currentSpeed = playerStats.speed;
    let currentFireRate = playerStats.fireRate * playerStats.swiftCooldon;

    let vx = 0, vy = 0;

    if (cursors.left.isDown || wasd.left.isDown) vx = -currentSpeed;
    if (cursors.right.isDown || wasd.right.isDown) vx = currentSpeed;
    if (cursors.up.isDown || wasd.up.isDown) vy = -currentSpeed;
    if (cursors.down.isDown || wasd.down.isDown) vy = currentSpeed;

    if (moveVector.x !== 0 || moveVector.y !== 0) {
        vx = moveVector.x * currentSpeed;
        vy = moveVector.y * currentSpeed;
    }

    player.body.setVelocity(vx, vy);

    if (vx !== 0 || vy !== 0) {
        currentAngle = Math.atan2(vy, vx);
        if (player.characterGraphics) {
            player.characterGraphics.setRotation(currentAngle);
        }
    }

    let inBush = false;
    sceneRef.physics.overlap(player, bushesGroup, () => { inBush = true; });
    player.setAlpha(inBush ? 0.4 : 1.0);
    player.inBush = inBush;

    if (player.shieldGraphic) {
        player.shieldGraphic.setVisible(playerStats.shield > 0);
    }

    Object.keys(otherPlayers).forEach(id => {
        let other = otherPlayers[id];
        let otherInBush = false;
        sceneRef.physics.overlap(other, bushesGroup, () => { otherInBush = true; });
        other.setAlpha(otherInBush ? 0 : 1.0);
    });

    arrowsGroup.getChildren().concat(otherArrowsGroup.getChildren()).forEach(arrow => {
        let arrowInBush = false;
        sceneRef.physics.overlap(arrow, bushesGroup, () => { arrowInBush = true; });
        
        if (arrow.isOwner) {
            arrow.setAlpha(arrowInBush ? 0.4 : 1.0);
        } else {
            arrow.setAlpha(arrowInBush ? 0 : 1.0);
        }
    });

    let now = sceneRef.time.now;
    if (now - lastFired > currentFireRate) {
        lastFired = now;
        let count = playerStats.arrowCount;
        let effects = {
            poison: playerStats.hasPoison,
            frost: playerStats.hasFrost,
            explosive: playerStats.hasExplosive
        };

        if (count === 1) {
            fireArrowLocal(sceneRef, player.x, player.y, currentAngle, true, playerStats.piercing, inBush, playerStats.arrowScale, effects);
        } else {
            let spreadAngle = 0.3;
            let startAngle = currentAngle - (spreadAngle / 2);
            let step = spreadAngle / (count - 1);
            for (let i = 0; i < count; i++) {
                let angle = startAngle + (step * i);
                fireArrowLocal(sceneRef, player.x, player.y, angle, true, playerStats.piercing, inBush, playerStats.arrowScale, effects);
            }
        }
    }

    let rotation = player.characterGraphics ? player.characterGraphics.rotation : 0;
    socket.emit('playerInput', { x: player.x, y: player.y, rotation: rotation, inBush: inBush });

    sceneRef.physics.overlap(player, gemsGroup, (p, gem) => {
        socket.emit('collectGem', gem.id);
        gem.destroy();
        gainExp(25);
    });
}

function createPlayerContainer(scene, x, y, nameText, colorHex) {
    let container = scene.add.container(x, y);

    let shadow = scene.add.graphics();
    shadow.fillStyle(0x000000, 0.3); shadow.fillEllipse(0, 18, 36, 14);

    let charGfx = scene.add.graphics();
    charGfx.lineStyle(3, 0xf59e0b, 1);
    charGfx.beginPath(); charGfx.arc(12, 0, 16, -Math.PI/2.5, Math.PI/2.5, false); charGfx.strokePath();
    charGfx.fillStyle(colorHex, 1); charGfx.fillCircle(0, 0, 20);
    charGfx.lineStyle(3, 0xffffff, 0.9); charGfx.strokeCircle(0, 0, 20);
    charGfx.fillStyle(0xffffff, 1); charGfx.fillCircle(8, -6, 4); charGfx.fillCircle(8, 6, 4);

    let shieldGfx = scene.add.graphics();
    shieldGfx.lineStyle(3, 0xfacc15, 0.85);
    shieldGfx.strokeCircle(0, 0, 27);
    shieldGfx.fillStyle(0xfacc15, 0.15);
    shieldGfx.fillCircle(0, 0, 27);
    shieldGfx.setVisible(false);

    container.characterGraphics = charGfx;
    container.shieldGraphic = shieldGfx;

    let name = scene.add.text(0, -45, nameText, { font: 'bold 13px Arial', fill: '#ffffff', stroke: '#052e16', strokeThickness: 4 }).setOrigin(0.5);
    let hpBg = scene.add.rectangle(0, -30, 50, 8, 0x052e16).setStrokeStyle(1, 0x166534);
    let hpBar = scene.add.rectangle(-24, -30, 48, 6, 0x22c55e).setOrigin(0, 0.5);

    let gridGfx = scene.add.graphics();

    container.add([shadow, shieldGfx, charGfx, name, hpBg, hpBar, gridGfx]);
    container.hpBar = hpBar;
    container.gridGfx = gridGfx;
    container.setDepth(10);

    scene.physics.world.enable(container);
    container.body.setCircle(20, -20, -20);
    container.body.setCollideWorldBounds(true);

    // 初始繪製血條格線
    renderHpGrid(container, playerStats.maxHp);

    return container;
}

// 根據最大血量動態繪製每半格 (50 HP) 的分隔線
function renderHpGrid(container, maxHp) {
    if (!container || !container.gridGfx) return;
    let gridGfx = container.gridGfx;
    gridGfx.clear();
    gridGfx.lineStyle(1, 0x052e16, 0.9);

    let segments = Math.floor(maxHp / 50); // 每 50 HP 為半格
    for (let i = 1; i < segments; i++) {
        let gridX = -24 + (48 / segments) * i;
        gridGfx.lineBetween(gridX, -33, gridX, -27);
    }
}

function updateHpBar(container, hp, maxHp, shield = 0) {
    if (container && container.hpBar) {
        let pct = Math.max(0, hp / maxHp);
        container.hpBar.width = 48 * pct;
        if (shield > 0) {
            container.hpBar.setFillStyle(0x38bdf8);
        } else {
            container.hpBar.setFillStyle(0x22c55e);
        }
        renderHpGrid(container, maxHp);
    }
}

function initJoystick() {
    const manager = nipplejs.create({
        zone: document.getElementById('joystick-zone'),
        mode: 'static', position: { left: '70px', bottom: '70px' },
        color: 'white', size: 110
    });
    manager.on('move', (evt, data) => {
        if (data.vector) {
            moveVector.x = data.vector.x;
            moveVector.y = -data.vector.y;
        }
    });
    manager.on('end', () => { moveVector.x = 0; moveVector.y = 0; });
}

function spawnGem(scene, gemData) {
    let gemContainer = scene.add.container(gemData.x, gemData.y);
    let gemGfx = scene.add.graphics();
    gemGfx.fillStyle(0xfacc15, 1); gemGfx.fillCircle(0, 0, 7);
    gemContainer.add(gemGfx);
    gemContainer.id = gemData.id;
    gemContainer.setDepth(3);

    scene.physics.world.enable(gemContainer);
    gemContainer.body.setCircle(7, -7, -7);
    gemsGroup.add(gemContainer);
}

function fireArrowLocal(scene, x, y, angle, isOwner, isPiercing, inBush, scale = 1.0, effects = {}) {
    let arrow = scene.physics.add.sprite(x, y, 'arrowTex');
    arrow.setRotation(angle);
    arrow.setScale(scale);
    arrow.piercing = isPiercing;
    arrow.isOwner = isOwner;
    arrow.effects = effects;
    arrow.setDepth(8);

    if (effects.poison) {
        arrow.setTint(0x84cc16);
    } else if (effects.frost) {
        arrow.setTint(0x38bdf8);
    } else if (effects.explosive) {
        arrow.setTint(0xf43f5e);
    } else if (isPiercing) {
        arrow.setTint(0xf97316);
    }

    if (inBush) {
        arrow.setAlpha(isOwner ? 0.4 : 0);
    }

    if (isOwner) {
        arrowsGroup.add(arrow);
        socket.emit('shootArrow', { x: x, y: y, angle: angle, speed: 800, piercing: isPiercing, inBush: inBush, scale: scale, effects: effects });
    } else {
        otherArrowsGroup.add(arrow);
    }

    if (arrow.body) {
        scene.physics.velocityFromRotation(angle, 800, arrow.body.velocity);
    }

    scene.time.delayedCall(600, () => {
        if (arrow && arrow.active) arrow.destroy();
    });
}

function gainExp(amount) {
    playerStats.exp += amount;
    let targetExp = playerStats.level * 100;

    if (playerStats.exp >= targetExp) {
        playerStats.level++;
        playerStats.exp = 0;
        socket.emit('updateLevel', playerStats.level);

        showUpgradeModal();

        confetti({ particleCount: 50, angle: 60, spread: 55, origin: { x: 0 } });
        confetti({ particleCount: 50, angle: 120, spread: 55, origin: { x: 1 } });
    }
    updateGUI();
}

function showUpgradeModal() {
    let container = document.getElementById('skill-options-container');
    if (!container) return;
    
    container.innerHTML = '';

    let shuffled = [...ALL_SKILLS].sort(() => 0.5 - Math.random());
    let selectedSkills = shuffled.slice(0, 3);

    selectedSkills.forEach(skill => {
        let card = document.createElement('div');
        card.className = 'skill-card';
        card.onclick = () => applySkill(skill.id);
        card.innerHTML = `
            <i class="fa-solid ${skill.icon}" style="color:${skill.color};"></i>
            <b>${skill.name}</b>
            <span>${skill.desc}</span>
        `;
        container.appendChild(card);
    });

    let modal = document.getElementById('upgrade-modal');
    if (modal) modal.style.display = 'block';
}

function updateGUI() {
    document.getElementById('gui-level').innerText = playerStats.level;
    let targetExp = playerStats.level * 100;
    let pct = Math.min(100, Math.floor((playerStats.exp / targetExp) * 100));
    
    document.getElementById('exp-bar-fill').style.width = pct + '%';
    document.getElementById('exp-text').innerText = `${playerStats.exp} / ${targetExp}`;
}

function applySkill(type) {
    if (type === 'triple') playerStats.arrowCount += 1;
    if (type === 'speed') playerStats.fireRate = Math.max(80, Math.floor(playerStats.fireRate * 0.8));
    if (type === 'moveSpeed') playerStats.speed += 60;
    if (type === 'pierce') playerStats.piercing = true;
    if (type === 'lifesteal') playerStats.lifesteal += 0.15;
    if (type === 'hp') { 
        playerStats.maxHp += 50; 
        playerStats.hp += 50; 
    }
    if (type === 'shield') {
        playerStats.hasShield = true;
        playerStats.shield = Math.min(playerStats.maxShield, playerStats.shield + 50);
    }
    if (type === 'poison') playerStats.hasPoison = true;
    if (type === 'frost') playerStats.hasFrost = true;
    if (type === 'explosive') playerStats.hasExplosive = true;
    if (type === 'giant') playerStats.arrowScale += 0.8;
    
    document.getElementById('upgrade-modal').style.display = 'none';
    updateHpBar(player, playerStats.hp, playerStats.maxHp, playerStats.shield);
    updateGUI();
}
</script>
