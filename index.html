<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>弓箭手大作戰：雙端對戰版</title>
    <!-- Phaser & Socket.io -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <!-- FontAwesome & NippleJS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <!-- 外部動態與特效套件 (Animate.css, Canvas-Confetti, Howler) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0f172a; touch-action: none; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        
        #rotate-notice {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98); color: #38bdf8; z-index: 9999;
            flex-direction: column; justify-content: center; align-items: center; text-align: center; font-size: 20px; font-weight: bold;
        }
        #rotate-notice i { font-size: 60px; margin-bottom: 20px; animation: rotateAnim 2s infinite ease-in-out; color: #fbbf24; }
        @keyframes rotateAnim { 0% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } 100% { transform: rotate(0deg); } }

        #login-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px);
            display: flex; justify-content: center; align-items: center; z-index: 200;
        }
        .login-box {
            background: linear-gradient(145deg, #1e293b, #0f172a); border: 2px solid rgba(56, 189, 248, 0.5);
            padding: 35px 30px; border-radius: 24px; text-align: center; color: #fff; width: 90%; max-width: 380px;
        }
        .login-box h2 { margin-top: 0; margin-bottom: 25px; color: #38bdf8; font-size: 26px; }
        .login-box input {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.8); color: #fff; font-size: 16px; margin-bottom: 25px; text-align: center; outline: none;
        }
        .login-box button {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; font-size: 18px; font-weight: bold; cursor: pointer;
        }

        #top-gui {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px 25px; border-radius: 50px; color: #fff; z-index: 10;
        }
        .stat-box { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
        
        #joystick-zone { position: absolute; bottom: 120px; left: 40px; width: 140px; height: 140px; z-index: 20; }
        
        #leaderboard {
            position: absolute; top: 15px; right: 15px; background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 12px; padding: 10px 15px;
            color: #fff; width: 160px; z-index: 10; font-size: 13px;
        }
        #leaderboard h4 { margin: 0 0 8px 0; color: #facc15; font-size: 14px; text-align: center; }
        #leaderboard-list { list-style: none; padding: 0; margin: 0; }
        #leaderboard-list li { display: flex; justify-content: space-between; margin-bottom: 4px; }

        #kill-feed {
            position: absolute; top: 75px; left: 15px; color: #ef4444; font-weight: bold;
            font-size: 14px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); z-index: 10; pointer-events: none;
        }

        #upgrade-modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); border: 2px solid #38bdf8;
            padding: 25px; border-radius: 24px; text-align: center; color: #fff; z-index: 100; width: 90%; max-width: 440px;
        }
        .skill-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; max-height: 60vh; overflow-y: auto; }
        .skill-card {
            background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; padding: 12px 16px; border-radius: 16px;
            cursor: pointer; display: flex; align-items: center; gap: 15px; transition: all 0.2s;
        }
        .skill-card:hover { border-color: #38bdf8; transform: scale(1.02); }
    </style>
</head>
<body>

<div id="rotate-notice">
    <i class="fa-solid fa-mobile-screen-button"></i>
    <p>📱 請將手機轉為橫向<br>以獲得最佳體驗</p>
</div>

<div id="login-modal">
    <div class="login-box animate__animated animate__zoomIn">
        <h2><i class="fa-solid fa-bow-arrow"></i> 弓箭手大作戰</h2>
        <input type="text" id="player-name-input" placeholder="請輸入名字..." maxlength="10">
        <button onclick="startGame()">進入遊戲</button>
    </div>
</div>

<div id="game-container">
    <div id="top-gui">
        <div class="stat-box"><i class="fa-solid fa-crown" style="color:#facc15;"></i> LV.<span id="gui-level">1</span></div>
        <div class="stat-box"><i class="fa-solid fa-bolt" style="color:#38bdf8;"></i> <span id="gui-exp">0</span></div>
        <div class="stat-box"><i class="fa-solid fa-heart" style="color:#ef4444;"></i> <span id="gui-hp">100/100</span></div>
    </div>

    <div id="kill-feed"></div>

    <div id="leaderboard">
        <h4><i class="fa-solid fa-trophy"></i> 等級排行榜</h4>
        <ul id="leaderboard-list"></ul>
    </div>

    <div id="joystick-zone"></div>

    <div id="upgrade-modal" class="animate__animated animate__fadeInDown">
            <h3><i class="fa-solid fa-wand-magic-sparkles" style="color:#facc15;"></i> 等級提升！選擇能力</h3>
            <div class="skill-grid" id="skill-options-container"></div>
        </div>
</div>

<script>
const socket = io();
let game, sceneRef;
let player, otherPlayers = {}, otherPlayersGroup;
let arrowsGroup, otherArrowsGroup, gemsGroup, obstaclesGroup;
let cursors, wasd;
let lastFired = 0;
let moveVector = { x: 0, y: 0 };
let currentAngle = 0;

// 玩家屬性
let playerStats = { 
    name: '玩家', level: 1, exp: 0, hp: 100, maxHp: 100, 
    speed: 240, arrowCount: 1, fireRate: 300, 
    piercing: false, lifesteal: 0 
};

function checkOrientation() {
    const notice = document.getElementById('rotate-notice');
    let isPortrait = window.matchMedia ? window.matchMedia("(orientation: portrait)").matches : (window.innerHeight > window.innerWidth);
    if (isPortrait && window.innerWidth < 1024) notice.style.display = 'flex';
    else notice.style.display = 'none';
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', checkOrientation);
setTimeout(checkOrientation, 300);

function startGame() {
    let nameInput = document.getElementById('player-name-input').value.trim();
    if (nameInput) playerStats.name = nameInput;
    document.getElementById('login-modal').style.display = 'none';
    initGame();
    socket.emit('joinGame', { name: playerStats.name });
}

function initGame() {
    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        parent: 'game-container',
        scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { default: 'arcade', arcade: { debug: false } },
        scene: { create: create, update: update }
    };
    game = new Phaser.Game(config);
}

function create() {
    sceneRef = this;

    // 箭矢繪製
    let arrowGfx = sceneRef.make.graphics({x: 0, y: 0, add: false});
    arrowGfx.lineStyle(2, 0xd97706, 1);
    arrowGfx.lineBetween(0, 5, 18, 5);
    arrowGfx.fillStyle(0xf1f5f9, 1);
    arrowGfx.fillTriangle(18, 1, 24, 5, 18, 9);
    arrowGfx.fillStyle(0xef4444, 1);
    arrowGfx.fillRect(0, 2, 4, 6);
    arrowGfx.generateTexture('arrowTex', 26, 10);

    sceneRef.cameras.main.setBounds(0, 0, 1600, 1200);
    sceneRef.physics.world.setBounds(0, 0, 1600, 1200);

    let bgGraphics = sceneRef.add.graphics();
    bgGraphics.fillStyle(0x1e293b, 1);
    bgGraphics.fillRect(0, 0, 1600, 1200);
    for (let x = 0; x < 1600; x += 80) {
        for (let y = 0; y < 1200; y += 80) {
            let isEven = ((x / 80) + (y / 80)) % 2 === 0;
            bgGraphics.fillStyle(isEven ? 0x1e293b : 0x0f172a, 0.6);
            bgGraphics.fillRect(x, y, 80, 80);
        }
    }

    arrowsGroup = sceneRef.physics.add.group({ runChildUpdate: true });
    otherArrowsGroup = sceneRef.physics.add.group({ runChildUpdate: true });
    gemsGroup = sceneRef.physics.add.group();
    otherPlayersGroup = sceneRef.physics.add.group();
    obstaclesGroup = sceneRef.physics.add.staticGroup();

    cursors = sceneRef.input.keyboard.createCursorKeys();
    wasd = sceneRef.input.keyboard.addKeys({
        up: Phaser.Input.Keyboard.KeyCodes.W, down: Phaser.Input.Keyboard.KeyCodes.S,
        left: Phaser.Input.Keyboard.KeyCodes.A, right: Phaser.Input.Keyboard.KeyCodes.D
    });

    initJoystick();

    socket.on('initSelf', (data) => {
        player = createPlayerContainer(sceneRef, data.x, data.y, data.name, 0x38bdf8);
        player.id = socket.id;
        sceneRef.cameras.main.startFollow(player, true, 0.1, 0.1);

        sceneRef.physics.add.collider(player, obstaclesGroup);

        let minimap = sceneRef.cameras.add(window.innerWidth - 170, window.innerHeight - 130, 150, 110)
            .setZoom(0.08)
            .setName('mini');
        minimap.setBackgroundColor(0x0f172a);
        minimap.scrollX = 700;
        minimap.scrollY = 500;
    });

    socket.on('obstaclesData', (obsList) => {
        obsList.forEach(obs => {
            let rect = sceneRef.add.rectangle(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w, obs.h, 0x334155)
                .setStrokeStyle(3, 0x64748b);
            obstaclesGroup.add(rect);
        });

        // 非貫穿箭矢碰到障礙物銷毀
        sceneRef.physics.add.overlap(arrowsGroup, obstaclesGroup, (arrow) => {
            if (!arrow.piercing) arrow.destroy();
        });
        sceneRef.physics.add.overlap(otherArrowsGroup, obstaclesGroup, (arrow) => {
            if (!arrow.piercing) arrow.destroy();
        });
    });

    socket.on('currentPlayers', (players) => {
        Object.keys(players).forEach((id) => {
            if (id !== socket.id && !otherPlayers[id]) {
                addOtherPlayer(id, players[id]);
            }
        });
    });

    socket.on('newPlayer', (info) => {
        if (!otherPlayers[info.id] && info.id !== socket.id) {
            addOtherPlayer(info.id, info);
        }
    });

    socket.on('playerMoved', (info) => {
        if (otherPlayers[info.id]) {
            otherPlayers[info.id].setPosition(info.x, info.y);
            if (otherPlayers[info.id].characterGraphics) {
                otherPlayers[info.id].characterGraphics.setRotation(info.rotation);
            }
        }
    });

    socket.on('playerDisconnected', (id) => {
        if (otherPlayers[id]) {
            otherPlayers[id].destroy();
            delete otherPlayers[id];
        }
    });

    socket.on('gemsData', (gems) => { gems.forEach(g => spawnGem(sceneRef, g)); });
    socket.on('gemSpawn', (gem) => { spawnGem(sceneRef, gem); });
    socket.on('gemCollected', (gemId) => {
        gemsGroup.getChildren().forEach(g => { if (g.id === gemId) g.destroy(); });
    });

    socket.on('arrowFired', (data) => {
        fireArrowLocal(sceneRef, data.x, data.y, data.angle, false, data.piercing);
    });

    socket.on('playerHealthUpdate', (data) => {
        if (data.id === socket.id) {
            playerStats.hp = data.hp;
            updateGUI();
        }
        let target = (data.id === socket.id) ? player : otherPlayers[data.id];
        if (target) updateHpBar(target, data.hp, data.maxHp);
    });

    // 擊殺獲得獎勵
    socket.on('killReward', (data) => {
        gainExp(data.exp);
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }); // 擊殺慶祝花火
        
        let feed = document.getElementById('kill-feed');
        feed.innerText = `💥 你擊殺了 ${data.victimName}！經驗值 +${data.exp}`;
        setTimeout(() => { feed.innerText = ''; }, 3000);
    });

    // 死亡重置為 Level 1
    socket.on('playerRespawn', (data) => {
        if (data.id === socket.id) {
            // 本人死亡重置屬性
            playerStats.level = 1;
            playerStats.exp = 0;
            playerStats.hp = 100;
            playerStats.maxHp = 100;
            playerStats.speed = 240;
            playerStats.arrowCount = 1;
            playerStats.fireRate = 300;
            playerStats.piercing = false;
            playerStats.lifesteal = 0;

            player.setPosition(data.x, data.y);
            socket.emit('updateLevel', 1);
            updateGUI();
            updateHpBar(player, 100, 100);
        } else if (otherPlayers[data.id]) {
            otherPlayers[data.id].setPosition(data.x, data.y);
            updateHpBar(otherPlayers[data.id], data.hp, data.maxHp);
        }
    });

    socket.on('updateLeaderboard', (playersMap) => {
        let listEl = document.getElementById('leaderboard-list');
        listEl.innerHTML = '';
        let sorted = Object.values(playersMap).sort((a, b) => b.level - a.level);
        sorted.slice(0, 5).forEach(p => {
            let li = document.createElement('li');
            li.innerHTML = `<span>${p.name}</span><b>LV.${p.level}</b>`;
            listEl.appendChild(li);
        });
    });

    // 箭矢命中敵方
    sceneRef.physics.add.overlap(arrowsGroup, otherPlayersGroup, (arrow, targetContainer) => {
        if (targetContainer && targetContainer.id && targetContainer.id !== socket.id) {
            socket.emit('hitPlayer', {
                targetId: targetContainer.id,
                damage: 20,
                lifesteal: playerStats.lifesteal
            });

            // 如果沒有貫穿天賦，擊中後銷毀箭矢
            if (!arrow.piercing) {
                arrow.destroy();
            }
        }
    });
}

function addOtherPlayer(id, data) {
    let p = createPlayerContainer(sceneRef, data.x, data.y, data.name, 0xef4444);
    p.id = id;
    otherPlayers[id] = p;
    otherPlayersGroup.add(p);
}

function update() {
    if (!player || !player.body) return;

    let vx = 0, vy = 0;

    if (cursors.left.isDown || wasd.left.isDown) vx = -playerStats.speed;
    if (cursors.right.isDown || wasd.right.isDown) vx = playerStats.speed;
    if (cursors.up.isDown || wasd.up.isDown) vy = -playerStats.speed;
    if (cursors.down.isDown || wasd.down.isDown) vy = playerStats.speed;

    if (moveVector.x !== 0 || moveVector.y !== 0) {
        vx = moveVector.x * playerStats.speed;
        vy = moveVector.y * playerStats.speed;
    }

    player.body.setVelocity(vx, vy);

    if (vx !== 0 || vy !== 0) {
        currentAngle = Math.atan2(vy, vx);
        if (player.characterGraphics) {
            player.characterGraphics.setRotation(currentAngle);
        }
    }

    let now = sceneRef.time.now;
    if (now - lastFired > playerStats.fireRate) {
        lastFired = now;
        if (playerStats.arrowCount === 1) {
            fireArrowLocal(sceneRef, player.x, player.y, currentAngle, true, playerStats.piercing);
        } else {
            fireArrowLocal(sceneRef, player.x, player.y, currentAngle - 0.2, true, playerStats.piercing);
            fireArrowLocal(sceneRef, player.x, player.y, currentAngle, true, playerStats.piercing);
            fireArrowLocal(sceneRef, player.x, player.y, currentAngle + 0.2, true, playerStats.piercing);
        }
    }

    let rotation = player.characterGraphics ? player.characterGraphics.rotation : 0;
    socket.emit('playerInput', { x: player.x, y: player.y, rotation: rotation });

    sceneRef.physics.overlap(player, gemsGroup, (p, gem) => {
        socket.emit('collectGem', gem.id);
        gem.destroy();
        gainExp(25);
    });
}

function createPlayerContainer(scene, x, y, nameText, colorHex) {
    let container = scene.add.container(x, y);

    let shadow = scene.add.graphics();
    shadow.fillStyle(0x000000, 0.3); shadow.fillEllipse(0, 18, 36, 14);

    let charGfx = scene.add.graphics();
    charGfx.lineStyle(3, 0xf59e0b, 1);
    charGfx.beginPath(); charGfx.arc(12, 0, 16, -Math.PI/2.5, Math.PI/2.5, false); charGfx.strokePath();
    charGfx.fillStyle(colorHex, 1); charGfx.fillCircle(0, 0, 20);
    charGfx.lineStyle(3, 0xffffff, 0.9); charGfx.strokeCircle(0, 0, 20);
    charGfx.fillStyle(0xffffff, 1); charGfx.fillCircle(8, -6, 4); charGfx.fillCircle(8, 6, 4);

    container.characterGraphics = charGfx;

    let name = scene.add.text(0, -42, nameText, { font: 'bold 13px Arial', fill: '#ffffff', stroke: '#0f172a', strokeThickness: 4 }).setOrigin(0.5);
    let hpBg = scene.add.rectangle(0, -28, 44, 8, 0x0f172a).setStrokeStyle(1, 0x475569);
    let hpBar = scene.add.rectangle(-21, -28, 42, 6, 0x10b981).setOrigin(0, 0.5);

    container.add([shadow, charGfx, name, hpBg, hpBar]);
    container.hpBar = hpBar;

    scene.physics.world.enable(container);
    container.body.setCircle(20, -20, -20);
    container.body.setCollideWorldBounds(true);

    return container;
}

function updateHpBar(container, hp, maxHp) {
    if (container && container.hpBar) {
        let pct = Math.max(0, hp / maxHp);
        container.hpBar.width = 42 * pct;
    }
}

function initJoystick() {
    const manager = nipplejs.create({
        zone: document.getElementById('joystick-zone'),
        mode: 'static', position: { left: '70px', bottom: '70px' },
        color: 'white', size: 110
    });
    manager.on('move', (evt, data) => {
        if (data.vector) {
            moveVector.x = data.vector.x;
            moveVector.y = -data.vector.y;
        }
    });
    manager.on('end', () => { moveVector.x = 0; moveVector.y = 0; });
}

function spawnGem(scene, gemData) {
    let gemContainer = scene.add.container(gemData.x, gemData.y);
    let gemGfx = scene.add.graphics();
    gemGfx.fillStyle(0xfacc15, 1); gemGfx.fillCircle(0, 0, 7);
    gemContainer.add(gemGfx);
    gemContainer.id = gemData.id;

    scene.physics.world.enable(gemContainer);
    gemContainer.body.setCircle(7, -7, -7);
    gemsGroup.add(gemContainer);
}

function fireArrowLocal(scene, x, y, angle, isOwner, isPiercing) {
    let arrow = scene.physics.add.sprite(x, y, 'arrowTex');
    arrow.setRotation(angle);
    arrow.piercing = isPiercing;

    // 貫穿箭發光或色彩改變區隔
    if (isPiercing) arrow.setTint(0xf97316);

    if (isOwner) {
        arrowsGroup.add(arrow);
        socket.emit('shootArrow', { x: x, y: y, angle: angle, speed: 850, piercing: isPiercing });
    } else {
        otherArrowsGroup.add(arrow);
    }

    if (arrow.body) {
        scene.physics.velocityFromRotation(angle, 850, arrow.body.velocity);
    }

    scene.time.delayedCall(1200, () => {
        if (arrow && arrow.active) arrow.destroy();
    });
}

function gainExp(amount) {
    playerStats.exp += amount;
    if (playerStats.exp >= playerStats.level * 100) {
        playerStats.level++;
        playerStats.exp = 0;
        socket.emit('updateLevel', playerStats.level);

        let modal = document.getElementById('upgrade-modal');
        modal.style.display = 'block';

        // Canvas Confetti 升級彩帶
        confetti({ particleCount: 50, angle: 60, spread: 55, origin: { x: 0 } });
        confetti({ particleCount: 50, angle: 120, spread: 55, origin: { x: 1 } });
    }
    updateGUI();
}

function updateGUI() {
    document.getElementById('gui-level').innerText = playerStats.level;
    document.getElementById('gui-exp').innerText = playerStats.exp;
    document.getElementById('gui-hp').innerText = `${playerStats.hp}/${playerStats.maxHp}`;
}

function applySkill(type) {
    if (type === 'triple') playerStats.arrowCount = 3;
    if (type === 'speed') playerStats.fireRate = 150;
    if (type === 'moveSpeed') playerStats.speed = 310;
    if (type === 'pierce') playerStats.piercing = true;
    if (type === 'lifesteal') playerStats.lifesteal = 0.25;
    if (type === 'hp') { playerStats.maxHp += 50; playerStats.hp += 50; }
    
    document.getElementById('upgrade-modal').style.display = 'none';
    updateGUI();
}
</script>
</body>
</html>
